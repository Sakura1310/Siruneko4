<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>みけねこ授業 - メモ・レポート</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fffdf9;
  color: #333;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    sans-serif;
}

/* =====================
   ヘッダー
===================== */

.header {
  height: 78px;
  background: white;
  border-bottom: 1px solid #f1e8d8;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 18px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-icon {
  width: 43px;
  height: 43px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ffb52b, #ff8d00);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 21px;
}

.brand-name {
  font-size: 16px;
  font-weight: 800;
}

.brand-sub {
  color: #999;
  font-size: 9px;
}

.nav {
  display: flex;
  gap: 6px;
}

.nav-btn {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 14px;
  border: none;
  background: transparent;
  font-size: 19px;
  color: #666;
  cursor: pointer;
  transition: background 0.2s;
  text-decoration: none;
}

.nav-btn.active {
  background: #fff1c8;
}

/* =====================
   メインコンテンツエリア
===================== */

.main {
  max-width: 760px;
  margin: auto;
  padding: 26px 18px 100px;
}

.view-section {
  display: none;
}

.view-section.active {
  display: block;
}

.page-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.page-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 22px;
  font-weight: 900;
  color: #222;
  margin: 0;
}

.count-badge {
  color: #aaa;
  font-size: 18px;
  font-weight: 700;
}

/* オレンジ色の新規メモボタン */
.btn-new-note {
  background: linear-gradient(135deg, #ffa826, #ff7b00);
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 18px;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(255, 138, 0, 0.25);
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn-new-note:hover {
  opacity: 0.92;
}

/* ピル型タグフィルター */
.filter-bar {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 12px;
  margin-bottom: 24px;
  scrollbar-width: none;
}

.filter-bar::-webkit-scrollbar {
  display: none;
}

.filter-chip {
  background: white;
  border: 1px solid #ebdccb;
  color: #666;
  padding: 7px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}

.filter-chip.active {
  background: #2b2825;
  color: white;
  border-color: #2b2825;
}

/* 空の状態 */
.empty-box {
  padding: 70px 20px;
  text-align: center;
  color: #c4b6a5;
}

.empty-icon-svg {
  width: 64px;
  height: 64px;
  margin-bottom: 14px;
  opacity: 0.35;
}

.empty-text {
  font-size: 15px;
  font-weight: 700;
  color: #b5a490;
}

/* =====================
   自作メモのカード表示
===================== */

.memo-grid {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.custom-memo-card {
  background: white;
  border: 1px solid #eee9df;
  border-radius: 20px;
  padding: 18px 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}

.memo-card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}

.memo-card-title {
  font-size: 16px;
  font-weight: 800;
  color: #222;
}

.memo-tag-badge {
  background: #fff3c4;
  color: #a66b14;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 10px;
}

.memo-card-body {
  font-size: 14px;
  line-height: 1.6;
  color: #555;
  white-space: pre-wrap;
  margin-bottom: 12px;
}

.memo-card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: #aaa;
  border-top: 1px dashed #f2e9dc;
  padding-top: 10px;
}

.btn-del-small {
  border: none;
  background: transparent;
  color: #d9534f;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}

/* =====================
   学習レポートカード（📖ビュー用）
===================== */

.report-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.report-card {
  background: white;
  border: 1px solid #eee9df;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}

.card-header {
  padding: 18px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
}

.card-header:hover {
  background-color: #faf8f3;
}

.card-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.clock-icon {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  background: #fff0c9;
  color: #d97706;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.card-topic {
  font-size: 16px;
  font-weight: 800;
}

.card-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: #999;
  margin-top: 4px;
}

.status-tag {
  background: #fff3c4;
  color: #a66b14;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 6px;
}

.arrow-icon {
  font-size: 14px;
  color: #aaa;
  transition: transform 0.3s ease;
}

.report-card.active .arrow-icon {
  transform: rotate(180deg);
}

.card-body {
  display: none;
  padding: 0 20px 20px 20px;
  border-top: 1px dashed #f0e7d8;
  background: #fffdfa;
}

.report-card.active .card-body {
  display: block;
}

.chat-log {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 12px;
}

.log-msg {
  display: flex;
  gap: 8px;
  font-size: 13px;
}

.log-msg.user {
  justify-content: flex-end;
}

.log-bubble {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: 14px;
  background: #fff;
  border: 1px solid #f2e4c4;
}

.log-msg.user .log-bubble {
  background: #fff0ce;
}

/* モーダル（新規メモ追加） */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4);
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 1000;
}

.modal-overlay.active {
  display: flex;
}

.modal-content {
  background: white;
  width: 100%;
  max-width: 480px;
  border-radius: 24px;
  padding: 24px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

.modal-title {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 16px;
}

.form-group {
  margin-bottom: 14px;
}

.form-label {
  font-size: 12px;
  font-weight: 700;
  color: #777;
  margin-bottom: 6px;
  display: block;
}

.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid #e2d8c8;
  border-radius: 12px;
  font-size: 14px;
  outline: none;
  font-family: inherit;
}

.form-textarea {
  height: 110px;
  resize: vertical;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 20px;
}

.btn-cancel {
  border: 1px solid #ddd;
  background: white;
  padding: 8px 16px;
  border-radius: 12px;
  font-weight: 700;
  cursor: pointer;
}

.btn-save {
  background: #ff8a00;
  color: white;
  border: none;
  padding: 8px 18px;
  border-radius: 12px;
  font-weight: 700;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- ヘッダー -->
<header class="header">
  <div class="brand">
    <div class="brand-icon">🐾</div>
    <div>
      <div class="brand-name">みけねこ授業</div>
      <div class="brand-sub">教えて学ぶ・ふりかえる</div>
    </div>
  </div>

  <nav class="nav">
    <a href="lesson.html" class="nav-btn">🎓</a>
    <button class="nav-btn" id="btnTabReport" onclick="switchView('reports')">📖</button>
    <button class="nav-btn active" id="btnTabNotes" onclick="switchView('notes')">🗒</button>
  </nav>
</header>

<main class="main">

  <!-- ① 自作メモ ビュー (🗒) -->
  <section id="viewNotes" class="view-section active">
    <div class="page-title-row">
      <h1 class="page-title">
        📝 自作メモ <span class="count-badge" id="customNoteCount">(0)</span>
      </h1>
      <button class="btn-new-note" onclick="openNoteModal()">
        <span>＋</span> 新規メモ
      </button>
    </div>

    <!-- タグフィルター -->
    <div class="filter-bar">
      <button class="filter-chip active" onclick="filterNotes('すべて', this)">すべて</button>
      <button class="filter-chip" onclick="filterNotes('要点まとめ', this)">要点まとめ</button>
      <button class="filter-chip" onclick="filterNotes('復習', this)">復習</button>
      <button class="filter-chip" onclick="filterNotes('疑問点', this)">疑問点</button>
      <button class="filter-chip" onclick="filterNotes('アイデア', this)">アイデア</button>
    </div>

    <div id="customMemoContainer">
      <!-- JSでカードまたは空状態が表示されます -->
    </div>
  </section>

  <!-- ② 学習レポート ビュー (📖) -->
  <section id="viewReports" class="view-section">
    <div class="page-title-row">
      <h1 class="page-title">
        📖 学習レポート <span class="count-badge" id="reportCount">(0)</span>
      </h1>
    </div>

    <div class="report-list" id="reportList">
      <!-- 保存された学習レポートが表示されます -->
    </div>
  </section>

</main>

<!-- 新規メモ作成モーダル -->
<div class="modal-overlay" id="noteModal">
  <div class="modal-content">
    <div class="modal-title">📝 新しいメモを作成</div>
    
    <div class="form-group">
      <label class="form-label">タイトル</label>
      <input type="text" class="form-input" id="inputTitle" placeholder="メモのタイトルを入力...">
    </div>

    <div class="form-group">
      <label class="form-label">カテゴリタグ</label>
      <select class="form-select" id="selectTag">
        <option value="要点まとめ">要点まとめ</option>
        <option value="復習">復習</option>
        <option value="疑問点">疑問点</option>
        <option value="アイデア">アイデア</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">メモ本文</label>
      <textarea class="form-textarea" id="inputBody" placeholder="ここに自由にご記入ください..."></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeNoteModal()">キャンセル</button>
      <button class="btn-save" onclick="saveCustomNote()">保存する</button>
    </div>
  </div>
</div>

<script>
let currentFilter = "すべて";

// タブ切り替え（📖 ↔ 🗒）
function switchView(viewName) {
  document.getElementById("viewNotes").classList.remove("active");
  document.getElementById("viewReports").classList.remove("active");
  document.getElementById("btnTabNotes").classList.remove("active");
  document.getElementById("btnTabReport").classList.remove("active");

  if (viewName === 'notes') {
    document.getElementById("viewNotes").classList.add("active");
    document.getElementById("btnTabNotes").classList.add("active");
    loadCustomNotes();
  } else {
    document.getElementById("viewReports").classList.add("active");
    document.getElementById("btnTabReport").classList.add("active");
    loadReports();
  }
}

// モーダル開閉
function openNoteModal() {
  document.getElementById("noteModal").classList.add("active");
  document.getElementById("inputTitle").value = "";
  document.getElementById("inputBody").value = "";
}

function closeNoteModal() {
  document.getElementById("noteModal").classList.remove("active");
}

// 自作メモの保存
function saveCustomNote() {
  const title = document.getElementById("inputTitle").value.trim();
  const tag = document.getElementById("selectTag").value;
  const body = document.getElementById("inputBody").value.trim();

  if (!title || !body) {
    alert("タイトルと本文を入力してください。");
    return;
  }

  const now = new Date();
  const dateStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  const newNote = { id: Date.now(), title, tag, body, date: dateStr };

  let notes = JSON.parse(localStorage.getItem("mikeneko_custom_memos") || "[]");
  notes.push(newNote);
  localStorage.setItem("mikeneko_custom_memos", JSON.stringify(notes));

  closeNoteModal();
  loadCustomNotes();
}

// 自作メモの読み込みと描画
function loadCustomNotes() {
  const container = document.getElementById("customMemoContainer");
  const countBadge = document.getElementById("customNoteCount");
  let notes = JSON.parse(localStorage.getItem("mikeneko_custom_memos") || "[]");

  countBadge.textContent = `(${notes.length})`;

  // フィルタリング
  if (currentFilter !== "すべて") {
    notes = notes.filter(n => n.tag === currentFilter);
  }

  if (notes.length === 0) {
    container.innerHTML = `
      <div class="empty-box">
        <svg class="empty-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <div class="empty-text">まだメモがありません。</div>
      </div>
    `;
    return;
  }

  container.innerHTML = "";
  const grid = document.createElement("div");
  grid.className = "memo-grid";

  notes.slice().reverse().forEach((note) => {
    const card = document.createElement("div");
    card.className = "custom-memo-card";
    card.innerHTML = `
      <div class="memo-card-header">
        <div class="memo-card-title">${escapeHtml(note.title)}</div>
        <span class="memo-tag-badge">${escapeHtml(note.tag)}</span>
      </div>
      <div class="memo-card-body">${escapeHtml(note.body)}</div>
      <div class="memo-card-footer">
        <span>📅 ${note.date}</span>
        <button class="btn-del-small" onclick="deleteCustomNote(${note.id})">🗑 削除</button>
      </div>
    `;
    grid.appendChild(card);
  });

  container.appendChild(grid);
}

// フィルター切り替え
function filterNotes(tag, btnElem) {
  currentFilter = tag;
  document.querySelectorAll(".filter-chip").forEach(b => b.classList.remove("active"));
  btnElem.classList.add("active");
  loadCustomNotes();
}

// メモ削除
function deleteCustomNote(id) {
  if (confirm("このメモを削除しますか？")) {
    let notes = JSON.parse(localStorage.getItem("mikeneko_custom_memos") || "[]");
    notes = notes.filter(n => n.id !== id);
    localStorage.setItem("mikeneko_custom_memos", JSON.stringify(notes));
    loadCustomNotes();
  }
}

// 学習レポートの描画 (📖)
function loadReports() {
  const container = document.getElementById("reportList");
  const countBadge = document.getElementById("reportCount");
  const savedData = JSON.parse(localStorage.getItem("mikeneko_memos") || "[]");

  countBadge.textContent = `(${savedData.length})`;
  container.innerHTML = "";

  if (savedData.length === 0) {
    container.innerHTML = `
      <div class="empty-box">
        <div class="empty-text">まだ保存された学習レポートはありません🐱</div>
      </div>
    `;
    return;
  }

  savedData.slice().reverse().forEach((item, index) => {
    const realIndex = savedData.length - 1 - index;
    const card = document.createElement("div");
    card.className = "report-card";

    const historyHtml = (item.history || []).map(msg => `
      <div class="log-msg ${msg.role === 'assistant' ? 'cat' : 'user'}">
        <div class="log-bubble">${escapeHtml(msg.content)}</div>
      </div>
    `).join("");

    card.innerHTML = `
      <div class="card-header" onclick="this.parentElement.classList.toggle('active')">
        <div class="card-left">
          <div class="clock-icon">🕒</div>
          <div>
            <div class="card-topic">${escapeHtml(item.topic || "無題のテーマ")}</div>
            <div class="card-meta">
              <span>📅 ${item.date || "日時未記録"}</span>
              <span class="status-tag">${item.status || "進行中"}</span>
            </div>
          </div>
        </div>
        <div class="arrow-icon">∨</div>
      </div>
      <div class="card-body">
        <div class="chat-log">${historyHtml}</div>
      </div>
    `;
    container.appendChild(card);
  });
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

// 初期化（自作メモを表示）
switchView('notes');
</script>

</body>
</html>
