<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン / アカウント作成 - しるねこ授業</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        sans-serif;
      background-color: #ffefd5; /* パステルオレンジ */
      color: #cd853f;          /* peru */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ヘッダー */
    .header {
      width: 100%;
      height: 70px;
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #f3d2a2;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #cd853f;
      font-weight: 800;
      font-size: 18px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #cd853f;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    /* メインエリア */
    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    .login-card {
      width: 100%;
      background: #ffffff;
      border: 2px solid #f5cf9c;
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 8px 24px rgba(205, 133, 63, 0.12);
      text-align: center;
    }

    .card-title {
      font-size: 22px;
      font-weight: 800;
      color: #cd853f;
      margin: 0 0 6px 0;
    }

    .card-sub {
      font-size: 13px;
      color: #b5722f;
      margin-bottom: 24px;
    }

    /* フォーム */
    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #cd853f;
      margin-bottom: 6px;
      margin-left: 4px;
    }

    .form-group input {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      border: 1.5px solid #ebd3b4;
      border-radius: 14px;
      font-size: 15px;
      color: #7c4815;
      outline: none;
      background: #fffdfa;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: #cd853f;
      box-shadow: 0 0 0 3px rgba(205, 133, 63, 0.2);
      background: #ffffff;
    }

    .error-msg {
      color: #e53e3e;
      font-size: 12px;
      margin-top: 5px;
      margin-left: 4px;
      display: none;
    }

    /* ボタン */
    .submit-btn {
      width: 100%;
      height: 50px;
      margin-top: 10px;
      border: none;
      border-radius: 16px;
      background: #cd853f;
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(205, 133, 63, 0.3);
      transition: transform 0.15s, opacity 0.15s;
    }

    .submit-btn:hover {
      opacity: 0.92;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    /* ログイン / 新規登録 切り替えボタン */
    .toggle-mode-btn {
      margin-top: 18px;
      background: none;
      border: none;
      color: #b5722f;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline;
    }

    /* 下部イラストエリア */
    .illustration-area {
      margin-top: 24px;
      text-align: center;
      width: 100%;
    }

    .illustration-img {
      width: 170px;
      height: auto;
      border-radius: 20px;
      filter: drop-shadow(0 6px 12px rgba(205, 133, 63, 0.2));
      transition: transform 0.3s ease;
    }

    .illustration-img:hover {
      transform: translateY(-4px);
    }
  </style>
</head>

<body>

  <!-- ヘッダー -->
  <header class="header">
    <a href="index.html" class="brand">
      <div class="brand-icon">🐾</div>
      <div>しるねこ授業</div>
    </a>
  </header>

  <main class="login-container">
    <div class="login-card">
      <h1 class="card-title" id="pageTitle">ログイン</h1>
      <p class="card-sub" id="pageSub">おなまえとパスワードを入力してね</p>

      <form id="authForm" onsubmit="handleAuth(event)">
        <!-- 名前（ひらがな＋数字）入力欄 -->
        <div class="form-group">
          <label for="username">おなまえ（ひらがな・数字）</label>
          <input 
            type="text" 
            id="username" 
            placeholder="例: さくら1210" 
            required 
            oninput="validateUsername(this)"
          >
          <div class="error-msg" id="nameError">ひらがなと数字で入力してね🐱</div>
        </div>

        <!-- パスワード入力欄 -->
        <div class="form-group">
          <label for="password">パスワード</label>
          <input 
            type="password" 
            id="password" 
            placeholder="数字や英数字を入力" 
            required
          >
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">ログインする 🐾</button>
      </form>

      <!-- 切り替えボタン -->
      <button type="button" class="toggle-mode-btn" id="toggleBtn" onclick="toggleAuthMode()">
        はじめての方はこちら（アカウント作成）
      </button>
    </div>

    <!-- 下の余白に画像を挿入 -->
    <div class="illustration-area">
      <img src="1000004488_2.jpg" alt="金木犀と白ねこ" class="illustration-img">
    </div>
  </main>

  <script>
    let isRegisterMode = false; // 新規登録モードかどうか

    // モード切り替え処理
    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;

      const pageTitle = document.getElementById("pageTitle");
      const pageSub = document.getElementById("pageSub");
      const submitBtn = document.getElementById("submitBtn");
      const toggleBtn = document.getElementById("toggleBtn");

      if (isRegisterMode) {
        pageTitle.textContent = "アカウント作成";
        pageSub.textContent = "新しいおなまえとパスワードを登録するにゃ";
        submitBtn.textContent = "アカウントをつくる 🐾";
        toggleBtn.textContent = "すでにアカウントをお持ちの方（ログイン）";
      } else {
        pageTitle.textContent = "ログイン";
        pageSub.textContent = "おなまえとパスワードを入力してね";
        submitBtn.textContent = "ログインする 🐾";
        toggleBtn.textContent = "はじめての方はこちら（アカウント作成）";
      }
    }

    // おなまえ入力チェック（ひらがな＋数字）
    function validateUsername(input) {
      const validRegex = /^[ぁ-んー0-9０-９\s]*$/;
      const errorEl = document.getElementById("nameError");

      if (!validRegex.test(input.value)) {
        errorEl.style.display = "block";
      } else {
        errorEl.style.display = "none";
      }
    }

    // 認証処理（送信）
    async function handleAuth(event) {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      // エンドポイントの切り替え (/api/register または /api/login)
      const endpoint = isRegisterMode ? '/api/register' : '/api/login';

      try {
        const response = await fetch(`http://localhost:3000${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ username, password })
        });

        const result = await response.json();

        if (result.success) {
          alert(result.message);
          window.location.href = "index.html"; // 成功したらホーム画面へ
        } else {
          alert(result.message || "失敗しました");
        }

      } catch (error) {
        console.error("通信エラー:", error);
        alert("サーバーに接続できませんでした。server.mjs が起動しているか確認してね🐱");
      }
    }
  </script>

</body>
</html>
