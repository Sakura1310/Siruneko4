<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ランキング - しるねこ授業</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
      background: #fffdf9;
      color: #222;
    }

    .header {
      height: 88px;
      padding: 14px 20px;
      background: #ffffff;
      border-bottom: 1px solid #f2e8d3;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      text-decoration: none;
      color: inherit;
    }

    .brand-icon {
      width: 47px;
      height: 47px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffb52b, #ff8e00);
      font-size: 24px;
    }

    .brand-name { font-size: 18px; font-weight: 800; }
    .brand-sub { margin-top: 2px; font-size: 11px; color: #999; }

    .nav { display: flex; gap: 5px; }

    .nav-button {
      width: 43px;
      height: 43px;
      border: 0;
      border-radius: 13px;
      background: transparent;
      font-size: 21px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: inherit;
    }

    .nav-button.active { background: #fff1c9; }

    .main {
      max-width: 680px;
      margin: 0 auto;
      padding: 40px 20px 100px;
    }

    .page-title {
      text-align: center;
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 24px;
    }

    .tab-container {
      display: flex;
      background: #f5eedf;
      padding: 4px;
      border-radius: 30px;
      margin-bottom: 24px;
    }

    .tab-button {
      flex: 1;
      padding: 12px 0;
      border: 0;
      border-radius: 26px;
      background: transparent;
      font-size: 14px;
      font-weight: 700;
      color: #887a65;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-button.active {
      background: #ffffff;
      color: #e88a00;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .ranking-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ranking-card {
      background: #ffffff;
      border: 1px solid #f0e2c2;
      border-radius: 18px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 12px rgba(255, 184, 60, 0.06);
    }

    .ranking-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .rank-badge {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      background: #f0f0f0;
      color: #666;
    }

    .rank-1 { background: #ffe600; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
    .rank-2 { background: #d7d7d7; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
    .rank-3 { background: #e2a061; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }

    .user-info { display: flex; flex-direction: column; }
    .user-name { font-weight: 700; font-size: 15px; }
    .topic-title { font-size: 12px; color: #888; margin-top: 2px; }

    .score-value { font-size: 20px; font-weight: 900; color: #e88a00; }
    .score-unit { font-size: 12px; font-weight: 700; margin-left: 2px; }

    .empty-message {
      text-align: center;
      color: #999;
      padding: 50px 20px;
      line-height: 1.8;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .header { height: 78px; padding: 12px 15px; }
      .brand-icon { width: 42px; height: 42px; font-size: 21px; }
      .brand-name { font-size: 16px; }
      .brand-sub { font-size: 9px; }
      .nav-button { width: 37px; height: 37px; font-size: 18px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="index.html" class="brand" title="ホームへ戻る">
      <div class="brand-icon">🐾</div>
      <div>
        <div class="brand-name">しるねこ授業</div>
        <div class="brand-sub">教えて学ぶ・ふりかえる</div>
      </div>
    </a>

    <nav class="nav">
      <a href="index.html" class="nav-button" title="ホーム">🏠</a>
      <a href="lesson.html" class="nav-button" title="授業">🎓</a>
      <a href="ranking.html" class="nav-button active" title="ランキング">🏅</a>
      <a href="memo.html" class="nav-button" title="ノート">📖</a>
      <a href="review.html" class="nav-button" title="レポート">📝</a>
    </nav>
  </header>

  <main class="main">
    <div class="page-title">🏅 分かりやすさスコア</div>

    <div class="tab-container">
      <button class="tab-button active" onclick="switchTab('my')">自己ハイスコア</button>
      <button class="tab-button" onclick="switchTab('history')">全挑戦の履歴</button>
    </div>

    <div id="rankingList" class="ranking-list"></div>
  </main>

  <script>
    // localStorage から実際の入力データのみを取得
    function getStoredHistory() {
      const data = localStorage.getItem('shironeko_history');
      return data ? JSON.parse(data) : [];
    }

    // 初期表示：自己ハイスコア順
    renderHighScore();

    function switchTab(type) {
      const buttons = document.querySelectorAll('.tab-button');
      buttons.forEach(btn => btn.classList.remove('active'));

      if (type === 'my') {
        buttons[0].classList.add('active');
        renderHighScore();
      } else {
        buttons[1].classList.add('active');
        renderHistoryList();
      }
    }

    // 1. テーマごとの最高得点（ハイスコアランキング）
    function renderHighScore() {
      const history = getStoredHistory();
      const container = document.getElementById('rankingList');

      if (history.length === 0) {
        showEmpty(container, "まだ授業の記録がないにゃ🐱<br>レッスンを受けてハイスコアを目指そう！");
        return;
      }

      // テーマごとに最高得点のみを抽出
      const topicMap = {};
      history.forEach(item => {
        if (!topicMap[item.topic] || topicMap[item.topic].score < item.score) {
          topicMap[item.topic] = item;
        }
      });

      // スコアが高い順に並び替え
      const highScores = Object.values(topicMap).sort((a, b) => b.score - a.score);

      renderCards(container, highScores);
    }

    // 2. 全挑戦の履歴（日付が新しい順）
    function renderHistoryList() {
      const history = getStoredHistory();
      const container = document.getElementById('rankingList');

      if (history.length === 0) {
        showEmpty(container, "まだ履歴がないにゃ🐱");
        return;
      }

      // 履歴を新しい順に並び替え
      const sortedHistory = [...history].reverse();

      renderCards(container, sortedHistory, false);
    }

    // カード描画処理
    function renderCards(container, list, showRank = true) {
      container.innerHTML = list.map((item, index) => {
        const rankClass = showRank && index < 3 ? `rank-${index + 1}` : '';
        const rankDisplay = showRank ? index + 1 : '🐾';

        return `
          <div class="ranking-card">
            <div class="ranking-left">
              <div class="rank-badge ${rankClass}">${rankDisplay}</div>
              <div class="user-info">
                <div class="user-name">${escapeHtml(item.topic)}</div>
                <div class="topic-title">${item.date || '記録あり'}</div>
              </div>
            </div>
            <div>
              <span class="score-value">${item.score}</span>
              <span class="score-unit">pt</span>
            </div>
          </div>
        `;
      }).join('');
    }

    // データが空の場合の表示
    function showEmpty(container, message) {
      container.innerHTML = `<div class="empty-message">${message}</div>`;
    }

    // エスケープ処理（セキュリティ対策）
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
