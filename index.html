<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>しるねこ授業</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        sans-serif;
      background: #fffdf9;
      color: #222;
    }

    button,
    input {
      font-family: inherit;
    }

    /* ヘッダー */
    .header {
      height: 88px;
      padding: 14px 20px;
      background: #ffffff;
      border-bottom: 1px solid #f2e8d3;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* ロゴ全体をリンクに変更＆デザイン維持 */
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      text-decoration: none; /* リンクの下線を消す */
      color: inherit;         /* 文字色を継承 */
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .brand:active {
      opacity: 0.8; /* タップした時に少しだけ透明にしてフィードバック */
    }

    .brand-icon {
      width: 47px;
      height: 47px;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(135deg, #ffb52b, #ff8e00);
      font-size: 24px;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 800;
    }

    .brand-sub {
      margin-top: 2px;
      font-size: 11px;
      color: #999;
    }

    .nav {
      display: flex;
      gap: 5px;
    }

    .nav-button {
      width: 43px;
      height: 43px;
      border: 0;
      border-radius: 13px;
      background: transparent;
      font-size: 21px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: inherit;
      transition: background-color 0.15s;
    }

    .nav-button.active {
      background: #fff1c9;
    }

    /* メイン */
    .main {
      max-width: 780px;
      margin: 0 auto;
      padding: 92px 22px 130px;
      text-align: center;
    }

    .ai-label {
      display: inline-block;
      padding: 9px 18px;
      border-radius: 30px;

      background: #fff4d0;
      color: #e88a00;

      font-size: 14px;
      font-weight: 700;
    }

    h1 {
      margin: 30px 0 0;

      font-size: clamp(32px, 7vw, 54px);
      line-height: 1.35;
      letter-spacing: -1px;
      font-weight: 900;
    }

    h1 span {
      color: #ed8700;
    }

    .description {
      margin: 28px auto 0;
      max-width: 680px;

      color: #888;
      font-size: 15px;
      line-height: 2;
    }

    /* 入力 */
    .lesson-box {
      width: 100%;
      margin: 43px auto 0;

      display: flex;
      align-items: center;

      padding: 7px;

      background: #fff;
      border: 1px solid #f0e2c2;
      border-radius: 38px;

      box-shadow: 0 12px 30px rgba(255, 184, 60, 0.12);
    }

    .lesson-box input {
      flex: 1;
      min-width: 0;

      border: 0;
      outline: 0;
      background: transparent;

      padding: 0 22px;

      font-size: 16px;
      color: #333;
    }

    .lesson-box input::placeholder {
      color: #c8c8c8;
    }

    .start-button {
      border: 0;
      border-radius: 32px;

      padding: 17px 28px;

      background: linear-gradient(
        135deg,
        #ffe8a8,
        #ffc99b
      );

      color: white;
      font-size: 16px;
      font-weight: 700;

      cursor: pointer;
      white-space: nowrap;

      transition: transform 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .start-button:active {
      transform: scale(0.97);
    }

    .start-button span {
      margin-left: 7px;
    }

    /* テーマ */
    .example-title {
      margin-top: 38px;
      color: #999;
      font-size: 14px;
    }

    .topics {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;

      margin-top: 16px;
    }

    .topics button {
      padding: 10px 18px;

      border: 1px solid #e7e7e7;
      border-radius: 25px;

      background: #fff;

      color: #666;
      font-size: 13px;

      cursor: pointer;
    }

    .topics button:active {
      background: #fff5df;
      border-color: #ffc56d;
    }

    /* スマホ */
    @media (max-width: 600px) {

      .header {
        height: 78px;
        padding: 12px 15px;
      }

      .brand-icon {
        width: 42px;
        height: 42px;
        font-size: 21px;
      }

      .brand-name {
        font-size: 16px;
      }

      .brand-sub {
        font-size: 9px;
      }

      .nav-button {
        width: 37px;
        height: 37px;
        font-size: 18px;
      }

      .main {
        padding: 66px 20px 120px;
      }

      .ai-label {
        font-size: 13px;
        padding: 8px 15px;
      }

      h1 {
        margin-top: 25px;
        font-size: 31px;
      }

      .description {
        margin-top: 24px;
        font-size: 13px;
        line-height: 1.9;
      }

      .lesson-box {
        display: block;
        padding: 7px;
        border-radius: 25px;
      }

      .lesson-box input {
        width: 100%;
        height: 52px;
        padding: 0 17px;
        font-size: 15px;
      }

      .start-button {
        width: 100%;
        padding: 15px;
        font-size: 15px;
      }

      .example-title {
        margin-top: 34px;
      }

      .topics button {
        padding: 9px 14px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <header class="header">

    <!-- ① ロゴ全体をホームへのリンク化 -->
    <a href="index.html" class="brand" title="ホームへ戻る">
      <div class="brand-icon">🐾</div>

      <div>
        <div class="brand-name">しるねこ授業</div>
        <div class="brand-sub">教えて学ぶ・ふりかえる</div>
      </div>
    </a>

    <!-- ② ナビゲーションの配置・activeを整理 -->
    <nav class="nav">
      <a href="index.html" class="nav-button active" title="ホーム">🏠</a>
      <a href="lesson.html" class="nav-button" title="授業">🎓</a>
      <a href="memo.html" class="nav-button" title="ノート">📖</a>
      <a href="review.html" class="nav-button" title="レポート">📝</a>
       <a href="ranking.html" class="nav-button" title="ランキング">🏅</a>
    </nav>

  </header>


  <main class="main">

    <div class="ai-label">
      ✨ みけねこ生徒と一緒に、教えて学ぶ
    </div>


    <h1>
      学びたいテーマを入力して
      <br>
      <span>みけねこ生徒に教えよう</span>
    </h1>


    <p class="description">
      あなたが「先生」、AIが予備知識ゼロの
      「みけねこ生徒🐱」。
      <br>
      1日10回の制限の中でできるだけ高い理解度を目指そう
    </p>


    <div class="lesson-box">

      <input
        id="topicInput"
        type="text"
        placeholder="例: 光合成の仕組み"
      >

      <button type="button" class="start-button" onclick="startLesson()">
        授業開始
        <span>→</span>
      </button>

    </div>


    <div class="example-title">
      テーマ例
    </div>


    <div class="topics">

      <button onclick="selectTopic('光合成の仕組み')">
        光合成の仕組み
      </button>

      <button onclick="selectTopic('ブロックチェーン')">
        ブロックチェーン
      </button>

      <button onclick="selectTopic('相対性理論')">
        相対性理論
      </button>

      <button onclick="selectTopic('なぜ虹が見えるのか')">
        なぜ虹が見えるのか
      </button>

      <button onclick="selectTopic('GDPとは何か')">
        GDPとは何か
      </button>

    </div>

  </main>


  <script>

    function selectTopic(topic) {
      document.getElementById("topicInput").value = topic;
    }


    function startLesson() {
      const topic = document.getElementById("topicInput").value.trim();

      if (!topic) {
        alert("学びたいテーマを入力してね🐱");
        return;
      }

      window.location.href =
        "lesson.html?topic=" +
        encodeURIComponent(topic);
    }

  </script>

</body>
</html>
