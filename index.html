<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>しるねこ</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #fff5f8;
      color: #555;
    }

    header {
      background: #ffb6c9;
      padding: 20px;
      text-align: center;
      color: white;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    .cat {
      font-size: 60px;
      text-align: center;
      margin-top: 30px;
    }

    .message {
      background: white;
      margin: 20px;
      padding: 20px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    button {
      display: block;
      width: calc(100% - 40px);
      margin: 15px 20px;
      padding: 16px;
      border: none;
      border-radius: 15px;
      background: #ff91ad;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>

  <header>
    <h1>🐈 しるねこ</h1>
    <p>いっしょにお勉強しよう！</p>
  </header>

  <div class="cat">🐈‍⬛</div>

  <div class="message">
    <p>こんにちは！</p>
    <p>今日は何を勉強する？</p>
  </div>

  <button>📚 登録販売者</button>
  <button>💊 お薬について質問する</button>
  <button>📝 問題を解く</button>

</body>
</html>
