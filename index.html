<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>しるねこ</title>
</head>

<body style="font-family:sans-serif; background:#fff7fb; text-align:center; padding:40px 20px;">

<h1 style="color:#555;">🐈 しるねこ</h1>

<div id="app">

  <p style="font-size:20px;">こんにちは！</p>

  <h2>今日は何を勉強する？</h2>

  <p>知りたいことを自由に入力してね。</p>

  <input
    id="topic"
    type="text"
    placeholder="例：NSAIDs、簿記、英語、哲学..."
    style="width:90%; max-width:400px; padding:14px; font-size:16px; border:1px solid #ddd; border-radius:10px;"
  >

  <br><br>

  <button
    onclick="startLearning()"
    style="padding:14px 25px; font-size:17px; border:none; border-radius:12px; background:#ffd6e8;"
  >
    📚 学習をはじめる
  </button>

</div>

<script>

let topic = "";
let level = "";

function startLearning() {

  topic = document.getElementById("topic").value.trim();

  if (!topic) {
    alert("🐈 まず、知りたいことを入力してね！");
    return;
  }

  document.getElementById("app").innerHTML = `

    <h2>🐈 ${topic}</h2>

    <p style="font-size:19px;">
      まず、あなたがどのくらい知っているか教えてね。
    </p>

    <button onclick="chooseLevel('まったく知らない')"
      style="display:block; width:90%; max-width:400px; margin:12px auto; padding:15px; font-size:16px; border:none; border-radius:12px; background:#ffe5ef;">
      🌱 まったく知らない
    </button>

    <button onclick="chooseLevel('少し知っている')"
      style="display:block; width:90%; max-width:400px; margin:12px auto; padding:15px; font-size:16px; border:none; border-radius:12px; background:#ffe5ef;">
      🌿 少し知っている
    </button>

    <button onclick="chooseLevel('基本は知っている')"
      style="display:block; width:90%; max-width:400px; margin:12px auto; padding:15px; font-size:16px; border:none; border-radius:12px; background:#ffe5ef;">
      🌳 基本は知っている
    </button>

    <button onclick="chooseLevel('かなり詳しい')"
      style="display:block; width:90%; max-width:400px; margin:12px auto; padding:15px; font-size:16px; border:none; border-radius:12px; background:#ffe5ef;">
      🌟 かなり詳しい
    </button>

  `;
}

function chooseLevel(selectedLevel) {

  level = selectedLevel;

  document.getElementById("app").innerHTML = `

    <h2>🐈 ${topic}</h2>

    <p style="font-size:18px;">
      「${level}」なんだね！
    </p>

    <h3>📚 学習ルート</h3>

    <div style="background:white; padding:20px; border-radius:15px; max-width:400px; margin:20px auto; text-align:left;">

      <p>① 🌱 基礎を確認する</p>

      <p>② 📖 重要な知識を学ぶ</p>

      <p>③ 🔎 具体例を知る</p>

      <p>④ 💭 自分で考えてみる</p>

      <p>⑤ 🐈 しるねこに説明してみる</p>

    </div>

    <button
      onclick="beginStudy()"
      style="padding:14px 25px; font-size:17px; border:none; border-radius:12px; background:#ffd6e8;"
    >
      📖 学習をはじめる
    </button>

  `;
}

function beginStudy() {

  document.getElementById("app").innerHTML = `

    <h2>📖 ${topic}を学ぼう</h2>

    <p style="font-size:18px;">
      ここから勉強タイム！🐈
    </p>

    <p>
      まずは自分で学んでみよう。<br>
      本や動画、教科書などを使ってOKだよ。
    </p>

    <br>

    <button
      onclick="teacherMode()"
      style="padding:14px 25px; font-size:17px; border:none; border-radius:12px; background:#ffd6e8;"
    >
      🐈 しるねこに教える
    </button>

  `;
}

function teacherMode() {

  document.getElementById("app").innerHTML = `

    <h2>🐈 先生、教えて！</h2>

    <p style="font-size:18px;">
      ここからは、あなたが先生だよ。
    </p>

    <p>
      「${topic}」について、<br>
      自分の言葉でしるねこに説明してみてね。
    </p>

    <textarea
      placeholder="しるねこに教えてみよう..."
      style="width:90%; max-width:400px; height:180px; padding:15px; font-size:16px; border:1px solid #ddd; border-radius:10px;"
    ></textarea>

    <br><br>

    <button
      style="padding:14px 25px; font-size:17px; border:none; border-radius:12px; background:#ffd6e8;"
    >
      🐈 説明する
    </button>

  `;

}

</script>

</body>
</html>
