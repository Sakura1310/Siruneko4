<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>しるねこ</title>
</head>

<body style="font-family:sans-serif; background:#fff7fb; text-align:center; padding:40px 20px;">

<h1 style="color:#555;">🐈 しるねこ</h1>

<p style="font-size:20px;">こんにちは！</p>

<h2>今日は何を勉強する？</h2>

<p>知りたいことを自由に入力してね。</p>

<input
  id="topic"
  type="text"
  placeholder="例：NSAIDs、簿記、英語、哲学..."
  style="width:90%; max-width:400px; padding:14px; font-size:16px; border:1px solid #ddd; border-radius:10px;"
>

<br><br>

<button
  onclick="startLearning()"
  style="padding:14px 25px; font-size:17px; border:none; border-radius:12px; background:#ffd6e8; cursor:pointer;"
>
📚 学習をはじめる
</button>

<div id="result" style="margin-top:30px; font-size:18px;"></div>

<script>
function startLearning() {
  const topic = document.getElementById("topic").value.trim();

  if (!topic) {
    document.getElementById("result").textContent =
      "🐈 まず、知りたいことを入力してね！";
    return;
  }

  document.getElementById("result").innerHTML =
    "🐈「" + topic + "」を一緒に勉強しよう！<br><br>" +
    "まずは、あなたがどのくらい知っているか聞いていくね。";
}
</script>

</body>
</html>
